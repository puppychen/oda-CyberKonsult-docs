<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法規／知識類型必填 Mockup</title>
  <style>
    :root { --primary:#1677ff; --text:#000000e0; --secondary:#00000073; --border:#f0f0f0; --content:#f5f5f5; --sider:#001529; --danger:#ff4d4f; --info-bg:#e6f4ff; --info-border:#91caff; }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; color:var(--text); background:#dfe3e8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; }
    button,select,input { font:inherit; }
    .review { min-height:52px; padding:8px 16px; display:flex; align-items:center; justify-content:center; gap:8px; border-bottom:1px solid #cbd1d8; background:#e8ebef; flex-wrap:wrap; }
    .review span { margin-right:6px; color:#475569; font-size:13px; font-weight:700; }
    .review button { min-height:34px; padding:0 13px; border:1px solid #b7bec8; border-radius:6px; background:#fff; cursor:pointer; }
    .review button.active { color:#fff; border-color:var(--primary); background:var(--primary); }
    .app { width:min(1400px,100%); min-height:calc(100vh - 52px); margin:auto; display:grid; grid-template-columns:200px 1fr; background:var(--content); box-shadow:0 10px 34px rgba(0,0,0,.13); }
    aside { background:var(--sider); color:#ffffffa6; }
    .logo { min-height:82px; padding:16px 24px; border-bottom:1px solid rgba(255,255,255,.12); background:#fff; }
    .logo img { width:120px; }
    .logo small { display:block; margin-top:3px; color:#666; font-size:13px; }
    nav { padding:8px 0; }
    nav div { min-height:40px; padding:10px 20px; }
    nav .active { color:#fff; background:var(--primary); }
    .right { min-width:0; }
    header { height:64px; padding:0 24px; display:flex; align-items:center; justify-content:flex-end; border-bottom:1px solid var(--border); background:#fff; }
    main { padding:24px; }
    .page { max-width:1200px; margin:auto; }
    h1 { margin:0 0 6px; font-size:28px; text-align:center; }
    .lead { margin:0 0 24px; color:var(--secondary); text-align:center; }
    .steps { display:grid; grid-template-columns:repeat(4,1fr); margin:26px 0 20px; }
    .step { position:relative; display:flex; align-items:center; gap:8px; color:var(--secondary); font-size:14px; }
    .step::after { content:""; height:1px; flex:1; background:#d9d9d9; }
    .step:last-child::after { display:none; }
    .step b { width:28px; height:28px; display:grid; place-items:center; border:1px solid #d9d9d9; border-radius:50%; background:#fff; }
    .step.done b { color:#fff; border-color:var(--primary); background:var(--primary); }
    .step.active { color:var(--text); }
    .step.active b { color:var(--primary); border-color:var(--primary); }
    .card { padding:24px; border:1px solid var(--border); border-radius:8px; background:#fff; }
    .card h2 { margin:0 0 16px; font-size:20px; }
    .success { margin-bottom:14px; padding:10px 14px; border:1px solid #b7eb8f; border-radius:6px; color:#237804; background:#f6ffed; }
    .info { margin-bottom:18px; padding:11px 14px; border:1px solid var(--info-border); border-radius:6px; color:#0958d9; background:var(--info-bg); line-height:1.55; }
    .field { margin-bottom:18px; }
    label { display:block; margin-bottom:8px; font-size:14px; }
    .required { margin-left:4px; color:var(--danger); }
    select,input { width:100%; min-height:34px; padding:0 11px; border:1px solid #d9d9d9; border-radius:6px; background:#fff; }
    select:focus,input:focus { border-color:#4096ff; outline:2px solid #91caff55; }
    .field-note { margin-top:6px; color:var(--secondary); font-size:12px; line-height:1.5; }
    .behavior { min-height:45px; margin:4px 0 18px; padding:10px 12px; border-left:3px solid var(--primary); background:#fafafa; font-size:13px; line-height:1.55; }
    details { margin-bottom:18px; border:1px solid var(--border); border-radius:6px; }
    summary { padding:12px 14px; cursor:pointer; font-weight:600; }
    .optional { padding:0 14px 14px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .optional .field { margin:0; }
    .batch { margin-bottom:18px; padding:10px 14px; border:1px solid #ffe58f; border-radius:6px; background:#fffbe6; font-size:13px; }
    .actions { display:flex; justify-content:flex-end; gap:8px; }
    .btn { min-height:38px; padding:0 16px; border:1px solid #d9d9d9; border-radius:6px; background:#fff; cursor:pointer; }
    .btn.primary { color:#fff; border-color:var(--primary); background:var(--primary); }
    .btn.primary:disabled { color:#00000040; border-color:#d9d9d9; background:#0000000a; cursor:not-allowed; }
    @media (max-width:760px) {
      .app { grid-template-columns:1fr; }
      aside { display:none; }
      header { height:52px; }
      main { padding:12px; }
      .card { padding:16px; }
      .steps { grid-template-columns:1fr 1fr; row-gap:12px; }
      .step:nth-child(2)::after,.step:last-child::after { display:none; }
      .optional { grid-template-columns:1fr; }
      .actions .btn { width:100%; }
    }
  </style>
</head>
<body>
  <div class="review">
    <span>Mockup 狀態（正式介面不顯示）</span>
    <button data-value="">未選擇</button>
    <button class="active" data-value="general">一般知識文件</button>
    <button data-value="law">法律</button>
    <button data-value="sop">SOP</button>
  </div>
  <div class="app">
    <aside>
      <div class="logo"><img src="../../../apps/admin/src/assets/cyberkonsult-logo.png" alt="CyberKonsult"><small>Data Cleaning</small></div>
      <nav><div class="active">⌂　首頁</div><div>☷　任務中心</div><div>▥　資料分析</div><div>♙　使用者管理</div><div>⌕　稽核日誌</div></nav>
    </aside>
    <section class="right">
      <header>System Admin　⌄</header>
      <main><div class="page">
        <h1>CyberKonsult 管理後台</h1>
        <p class="lead">知識庫總覽 + 個資清洗工作流程</p>
        <div class="steps"><div class="step done"><b>✓</b>上傳檔案</div><div class="step active"><b>2</b>法規／知識分類</div><div class="step"><b>3</b>清洗中</div><div class="step"><b>4</b>完成</div></div>
        <section class="card">
          <h2>步驟 2：法規／知識分類</h2>
          <div class="success">已成功上傳 3 份檔案</div>
          <div class="info">請為本批檔案選擇一種法規／知識類型。若檔案類型不同，請分批上傳。</div>
          <div class="field">
            <label for="type">法規／知識類型<span class="required">*</span></label>
            <select id="type">
              <option value="">請選擇</option>
              <option value="general" selected>一般知識文件</option>
              <option value="law">法律</option>
              <option value="regulation">子法／施行細則</option>
              <option value="iso_standard">ISO 標準</option>
              <option value="nist">NIST 標準</option>
              <option value="cis">CIS Controls</option>
              <option value="sop">標準作業程序（SOP／範本）</option>
              <option value="case">案例彙編</option>
            </select>
            <div class="field-note">此欄位會決定切塊、審查門檻、版本管理及知識庫分類方式。</div>
          </div>
          <div class="behavior" id="behavior">一般知識文件：使用一般文件處理，不啟用法規品質檢查與版本治理。</div>
          <details>
            <summary>法規附加資料（選填）</summary>
            <div class="optional">
              <div class="field"><label>發布機關</label><input placeholder="例：數位發展部"></div>
              <div class="field"><label>官方來源網址</label><input placeholder="https://law.moj.gov.tw/..."></div>
              <div class="field"><label>版本日期</label><input type="date"></div>
              <div class="field"><label>施行日期</label><input type="date"></div>
            </div>
          </details>
          <div class="batch">所選類型與附加資料將套用到全部 3 份檔案。</div>
          <div class="actions"><button class="btn primary" id="continue">套用並開始清洗</button></div>
        </section>
      </div></main>
    </section>
  </div>
  <script>
    const type = document.getElementById('type');
    const behavior = document.getElementById('behavior');
    const button = document.getElementById('continue');
    const messages = {
      general: '一般知識文件：使用一般文件處理，不啟用法規品質檢查與版本治理。',
      law: '法律：依條文結構切塊，審核前須完成法規品質檢查，並啟用版本與有效期間治理。',
      regulation: '子法／施行細則：依條文結構切塊，審核前須完成法規品質檢查，並啟用版本與有效期間治理。',
      iso_standard: 'ISO 標準：使用標準文件切塊與品質門檻，並啟用版本治理。',
      nist: 'NIST 標準：使用標準文件切塊與品質門檻，並啟用版本治理。',
      cis: 'CIS Controls：使用標準文件切塊與品質門檻，並啟用版本治理。',
      sop: 'SOP：使用一般文件處理，不要求法規條號與版本品質檢查。',
      case: '案例彙編：使用一般文件處理，不啟用法規版本治理。'
    };
    function update(value) {
      type.value = value;
      behavior.textContent = messages[value] || '尚未選擇：無法開始清洗。';
      button.disabled = !value;
      document.querySelectorAll('.review button').forEach((item) => item.classList.toggle('active', item.dataset.value === value));
    }
    type.addEventListener('change', () => update(type.value));
    document.querySelectorAll('.review button').forEach((item) => item.addEventListener('click', () => update(item.dataset.value)));
  </script>
</body>
</html>
