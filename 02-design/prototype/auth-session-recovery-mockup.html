<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入狀態恢復 Mockup</title>
  <style>
    :root {
      --surface-0:#f4f7fb; --surface-1:#fff; --surface-2:#edf2f9;
      --ink-1:#0f1e33; --ink-2:#47536b; --ink-3:#8a94a8;
      --border:#dce4f0; --brand:#1e3a8a; --accent:#0891b2;
      --warning:#b45309; --warning-bg:#fffbeb; --danger:#b91c1c; --danger-bg:#fef2f2;
    }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; color:var(--ink-1); background:#e6ebf2; font-family:system-ui,"Microsoft JhengHei",sans-serif; }
    button,textarea,input { font:inherit; }
    .review-tools { min-height:52px; padding:8px 16px; display:flex; align-items:center; justify-content:center; gap:8px; border-bottom:1px solid #c7d0dc; background:#dde4ed; }
    .review-tools span { margin-right:6px; color:#475569; font-size:13px; font-weight:700; }
    .review-tools button { min-height:34px; padding:0 12px; border:1px solid #aab6c5; border-radius:6px; color:#475569; background:#fff; cursor:pointer; }
    .review-tools button.active { color:#fff; border-color:var(--brand); background:var(--brand); }
    .app { position:relative; width:min(1280px,100%); height:calc(100vh - 52px); min-height:640px; margin:auto; display:flex; overflow:hidden; background:var(--surface-0); box-shadow:0 10px 36px rgba(15,30,51,.14); }
    .sidebar { width:288px; flex:0 0 288px; background:var(--surface-2); border-right:1px solid var(--border); }
    .sidebar-head { height:57px; padding:12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); color:var(--ink-2); font-size:14px; font-weight:700; }
    .search { width:calc(100% - 16px); height:34px; margin:8px; padding:0 12px; border:1px solid var(--border); border-radius:6px; background:var(--surface-1); }
    .conversation { padding:11px 12px; border-bottom:1px solid rgba(220,228,240,.7); font-size:14px; }
    .conversation.active { border-left:2px solid var(--accent); background:var(--surface-1); }
    .conversation small { display:block; margin-top:4px; color:var(--ink-3); }
    .main { min-width:0; flex:1; display:flex; flex-direction:column; }
    header { min-height:61px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.96); }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .brand img { width:132px; height:auto; }
    .brand h1 { margin:0; color:var(--brand); font-size:16px; }
    .account { min-height:34px; padding:0 10px; display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; color:var(--ink-2); background:#fff; font-size:13px; }
    .status { display:none; min-height:48px; padding:10px 18px; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid; font-size:13px; }
    .status.visible { display:flex; }
    .status.warning { color:#78350f; border-color:#fde68a; background:var(--warning-bg); }
    .status.danger { color:#7f1d1d; border-color:#fecaca; background:var(--danger-bg); }
    .status strong { display:block; margin-bottom:2px; font-size:14px; }
    .status button { min-height:30px; padding:0 10px; border:1px solid currentColor; border-radius:6px; color:inherit; background:transparent; cursor:pointer; white-space:nowrap; }
    .chat { flex:1; overflow:auto; padding:28px 24px; }
    .messages { max-width:760px; margin:auto; }
    .bubble { max-width:82%; margin-bottom:14px; padding:12px 14px; border-radius:8px; line-height:1.65; font-size:14px; }
    .bubble.user { margin-left:auto; color:#fff; background:linear-gradient(120deg,var(--brand),#0e7490); }
    .bubble.ai { border:1px solid var(--border); background:#fff; }
    .input-area { padding:16px; border-top:1px solid var(--border); background:var(--surface-1); }
    .input-wrap { max-width:768px; margin:auto; }
    .input-card { min-height:58px; padding:9px 10px 9px 14px; display:flex; align-items:flex-end; gap:8px; border:1px solid var(--border); border-radius:16px; background:#fff; }
    .input-card textarea { min-height:38px; max-height:120px; flex:1; padding:7px 2px; border:0; outline:0; resize:none; color:var(--ink-1); background:transparent; }
    .send { width:38px; height:38px; flex:none; border:0; border-radius:12px; color:#fff; background:linear-gradient(90deg,var(--brand),var(--accent)); cursor:pointer; }
    .send:disabled { cursor:not-allowed; opacity:.45; }
    .helper { margin-top:6px; color:var(--ink-3); font-size:11px; text-align:center; }
    .overlay { display:none; position:absolute; inset:0; z-index:5; place-items:center; padding:18px; background:rgba(15,30,51,.38); }
    .overlay.visible { display:grid; }
    .dialog { width:min(420px,100%); padding:22px; border:1px solid var(--border); border-radius:8px; background:#fff; box-shadow:0 18px 50px rgba(15,30,51,.24); }
    .dialog h2 { margin:0 0 10px; font-size:19px; }
    .dialog p { margin:0; color:var(--ink-2); font-size:14px; line-height:1.7; }
    .dialog label { display:block; margin-top:16px; color:var(--ink-2); font-size:13px; font-weight:600; }
    .dialog input { width:100%; min-height:40px; margin-top:6px; padding:0 11px; border:1px solid var(--border); border-radius:6px; color:var(--ink-1); background:#fff; }
    .dialog input:focus { border-color:var(--accent); outline:2px solid rgba(8,145,178,.18); }
    .dialog-actions { margin-top:20px; display:flex; justify-content:flex-end; gap:8px; }
    .dialog-actions button { min-height:36px; padding:0 14px; border:1px solid var(--border); border-radius:6px; background:#fff; cursor:pointer; }
    .dialog-actions .primary { color:#fff; border-color:var(--brand); background:var(--brand); }
    @media (max-width:760px) {
      .review-tools { flex-wrap:wrap; }
      .app { min-height:600px; }
      .sidebar { display:none; }
      .brand img { width:110px; }
      .brand h1,.account { display:none; }
      .status { align-items:flex-start; }
      .chat { padding:20px 12px; }
      .bubble { max-width:92%; }
      .input-area { padding:12px; }
    }
  </style>
</head>
<body>
  <div class="review-tools">
    <span>Mockup 情境（正式介面不顯示）</span>
    <button class="active" data-state="normal">正常使用</button>
    <button data-state="recoverable">連線暫時異常</button>
    <button data-state="expired">登入確定失效</button>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head"><span>對話記錄</span><span>＋　‹</span></div>
      <input class="search" placeholder="搜尋對話...">
      <div class="conversation active">郵件附件安全檢查<small>2026/7/13</small></div>
      <div class="conversation">帳號權限管理建議<small>2026/7/12</small></div>
    </aside>
    <section class="main">
      <header>
        <div class="brand"><img src="../../../apps/chatbot/src/assets/cyberkonsult-logo.png" alt="CyberKonsult"><h1>資安助手</h1></div>
        <div class="account">Jane⌄</div>
      </header>
      <div id="status" class="status" role="status" aria-live="polite">
        <div><strong id="statusTitle"></strong><span id="statusText"></span></div>
        <button id="retryButton" type="button">重新連線</button>
      </div>
      <main class="chat">
        <div class="messages">
          <div class="bubble user">收到不明寄件者的 Office 附件時，應如何檢查？</div>
          <div class="bubble ai">先不要直接開啟附件。請確認寄件網域、檔案副檔名與郵件內容是否符合平常往來情境，並使用隔離環境或防毒工具掃描。</div>
        </div>
      </main>
      <footer class="input-area">
        <div class="input-wrap">
          <div class="input-card">
            <textarea id="draft" rows="2">請再補充 Office 巨集與沙箱檢查步驟</textarea>
            <button id="sendButton" class="send" type="button" aria-label="送出">➤</button>
          </div>
          <div class="helper">尚未送出的內容會保留在目前裝置</div>
        </div>
      </footer>
    </section>
    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog">
        <h2 id="dialogTitle">登入已失效</h2>
        <p>目前對話與尚未送出的內容已保留。重新登入後會回到這個畫面。</p>
        <label for="reauthPassword">Jane · 請輸入密碼</label>
        <input id="reauthPassword" type="password" autocomplete="current-password" placeholder="密碼">
        <div class="dialog-actions"><button id="laterButton" type="button">稍後處理</button><button id="loginButton" class="primary" type="button">重新登入</button></div>
      </div>
    </div>
  </div>
  <script>
    const stateButtons = document.querySelectorAll('[data-state]');
    const status = document.getElementById('status');
    const statusTitle = document.getElementById('statusTitle');
    const statusText = document.getElementById('statusText');
    const retryButton = document.getElementById('retryButton');
    const overlay = document.getElementById('overlay');
    const sendButton = document.getElementById('sendButton');

    function setState(nextState) {
      stateButtons.forEach((button) => button.classList.toggle('active', button.dataset.state === nextState));
      status.className = 'status';
      overlay.classList.remove('visible');
      sendButton.disabled = false;

      if (nextState === 'recoverable') {
        status.classList.add('visible', 'warning');
        statusTitle.textContent = '連線暫時中斷，正在重試';
        statusText.textContent = '您的對話與輸入內容已保留。';
      }
      if (nextState === 'expired') {
        status.classList.add('visible', 'danger');
        statusTitle.textContent = '登入已失效';
        statusText.textContent = '重新登入後即可繼續。';
        overlay.classList.add('visible');
        sendButton.disabled = true;
      }
    }

    stateButtons.forEach((button) => button.addEventListener('click', () => setState(button.dataset.state)));
    retryButton.addEventListener('click', () => setState('normal'));
    document.getElementById('loginButton').addEventListener('click', () => {
      const password = document.getElementById('reauthPassword');
      if (!password.value) { password.focus(); return; }
      password.value = '';
      setState('normal');
    });
    document.getElementById('laterButton').addEventListener('click', () => overlay.classList.remove('visible'));
  </script>
</body>
</html>
